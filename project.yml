name: Hedef
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Hedef:
    type: application
    platform: iOS
    sources:
      - path: Hedef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefapp.hedef
        INFOPLIST_KEY_CFBundleDisplayName: Hedef
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Hedef/Hedef.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HedefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HedefTests
    dependencies:
      - target: Hedef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefapp.hedef.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  Hedef:
    build:
      targets:
        Hedef: all
    test:
      targets:
        - HedefTests
