<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seyir kontrol testi</title>
<style>body{margin:70px;background:#17191b;color:#eee;font:28px system-ui}h1{font-size:42px;font-weight:500}button,input,a{display:inline-block;font:inherit;margin:20px;padding:24px;background:#313537;color:white;border:1px solid #737b7c;border-radius:12px}input{width:440px}section{height:1500px}#count{color:#d7edb8}</style>
<h1>Kumanda ve sayfa kontrol testi</h1><p>Bu sayfa yalnızca geliştirme kontrollerinde kullanılır.</p>
<input id="text" placeholder="Metin girişi"><button id="counter" onclick="window.hits=(window.hits||0)+1;document.querySelector('#count').textContent=hits">Tıkla</button><a id="link" href="#bottom">Alta git</a><p id="count">0</p><section></section><p id="bottom">Sayfa sonu</p></html>
