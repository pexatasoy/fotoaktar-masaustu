name: Ters Kule derle

on:
  workflow_dispatch:

jobs:
  derle:
    # GitHub'ın macOS 26 sunucusu, Xcode 26 kurulu. Kaynak depodan değil sunucudan geliyor; depoda yalnız bu dosya var.
    runs-on: macos-26

    steps:
      - name: Kaynağı çek
        run: |
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -H "Cache-Control: no-cache" -o kaynak.zip https://chainmedia.co/fotoyol/terskule/terskule-kaynak.zip \
            || { echo "Kaynak indirilemedi."; exit 1; }
          unzip -oq kaynak.zip
          echo "--- bu derlemedeki kaynak ---"
          cat DAMGA.txt
          ls -R Kaynaklar project.yml | head -60

      - name: Ortamı göster
        run: |
          sw_vers
          xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: Derle (imzasız — imzalamayı Sideloadly yapacak)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project terskule.xcodeproj \
            -scheme terskule \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath yapi \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build > derleme.log 2>&1; then
              echo ""
              echo "================== DERLEME HATALARI =================="
              grep -E "error:" derleme.log | sed "s|$PWD/||" | sort -u | head -60
              echo "====================================================="
              exit 1
          fi
          echo "✅ derleme başarılı"

      - name: Tam günlüğü sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-gunlugu
          path: derleme.log
          retention-days: 7
          if-no-files-found: ignore

      # SwiftUI Linux'ta derlenmiyor; arayüzü görmenin tek yolu bu. Ayrı simülatör derlemesi şart (mimari farklı).
      - name: Simülatör ekran görüntüsü
        continue-on-error: true
        run: |
          set -x
          xcodebuild \
            -project terskule.xcodeproj -scheme terskule \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath sim \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -quiet build || exit 0
          UYG=$(find sim/Build/Products -name "terskule.app" -maxdepth 3 | head -1)
          echo "uygulama: $UYG"
          [ -z "$UYG" ] && exit 0
          mkdir -p gorseller
          xcrun simctl list devices available | grep -E "iPhone" | head -10
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 17 Pro (" | grep -oE "[0-9A-F-]{36}") || true
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
          [ -z "$UDID" ] && exit 0
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          xcrun simctl install "$UDID" "$UYG" || exit 0
          xcrun simctl launch "$UDID" com.terskule.prototip || true
          sleep 8
          xcrun simctl io "$UDID" screenshot gorseller/hazirlik.png || true
          xcrun simctl terminate "$UDID" com.terskule.prototip || true
          xcrun simctl launch "$UDID" com.terskule.prototip -demo || true
          sleep 25
          xcrun simctl io "$UDID" screenshot gorseller/dalga_25sn.png || true
          sleep 60
          xcrun simctl io "$UDID" screenshot gorseller/dalga_85sn.png || true
          xcrun simctl terminate "$UDID" com.terskule.prototip || true
          ls -la gorseller/ || true

      - name: Ekran görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: gorseller/
          retention-days: 7
          if-no-files-found: ignore

      - name: .ipa dosyasına paketle
        run: |
          mkdir -p Payload
          cp -R yapi/Build/Products/Release-iphoneos/terskule.app Payload/
          zip -qry terskule.ipa Payload
          ls -lh terskule.ipa

      - name: İndirilebilir hale getir
        uses: actions/upload-artifact@v4
        with:
          name: terskule-ipa
          path: terskule.ipa
          retention-days: 30
