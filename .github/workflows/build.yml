name: iOS build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild -project Hedef.xcodeproj -scheme Hedef -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if "iPhone" in device["name"] and device["isAvailable"]))')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: xcodebuild -project Hedef.xcodeproj -scheme Hedef -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' CODE_SIGNING_ALLOWED=NO test
