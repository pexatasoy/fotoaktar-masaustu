name: Medowl iOS derle

# İmzasız derleme + simülatörde ekran görüntüsü (ContacTeam'in derle-contacteam.yml'inden türedi).
# ⚠️ Kaynak depodan DEĞİL sunucudan gelir (yayinla-ios.sh ile yayınlanır); depoda yalnız bu tarif durur.
on:
  workflow_dispatch:

jobs:
  derle:
    runs-on: macos-26

    steps:
      - name: Kaynağı çek
        run: |
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -H "Cache-Control: no-cache" -o kaynak.zip \
            https://chainmedia.co/fotoyol/md-1dee4ebcfef5b337936b/medowl-kaynak.zip \
            || { echo "Kaynak indirilemedi — sunucu geçici olarak erişilemiyor olabilir."; exit 1; }
          unzip -oq kaynak.zip
          echo "--- bu derlemedeki kaynak ---"
          cat DAMGA.txt

      - name: Ortamı göster
        run: |
          sw_vers
          xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: Çekirdek testleri (macOS)
        run: |
          cd Cekirdek && swift test 2>&1 | tail -5

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project Medowl.xcodeproj \
            -scheme Medowl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath yapi \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build > derleme.log 2>&1; then
              echo ""
              echo "================== DERLEME HATALARI =================="
              grep -E "error:" derleme.log | sed "s|$PWD/||" | sort -u | head -60
              echo "====================================================="
              exit 1
          fi
          echo "✅ derleme başarılı"

      - name: Tam günlüğü sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-gunlugu
          path: derleme.log
          retention-days: 7
          if-no-files-found: ignore

      # SwiftUI Linux'ta derlenmiyor; arayüzü GÖRMENİN tek yolu bu.
      # DEBUG derlemesi -ornek (örnek ilaçlar) ve -ekran (sekme) bayraklarını okur (Medowl/Uygulama/Perde.swift).
      - name: Simülatör ekran görüntüleri
        continue-on-error: true
        run: |
          xcodebuild \
            -project Medowl.xcodeproj -scheme Medowl \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath sim \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -quiet build || exit 0
          UYG=$(find sim/Build/Products -name "Medowl.app" -maxdepth 3 | head -1)
          echo "uygulama: $UYG"
          [ -z "$UYG" ] && exit 0
          mkdir -p gorseller
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 17 Pro Max (" | grep -oE "[0-9A-F-]{36}") || true
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
          [ -z "$UDID" ] && exit 0
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          xcrun simctl status_bar "$UDID" override --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 --dataNetwork wifi || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array tr-TR || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string tr_TR || true
          xcrun simctl spawn "$UDID" defaults write com.apple.preferences.datetime TMZ -string Europe/Istanbul || true
          xcrun simctl install "$UDID" "$UYG" || exit 0
          xcrun simctl privacy "$UDID" grant notifications com.medowl.app 2>/dev/null || true
          xcrun simctl io "$UDID" screenshot gorseller/sb-ana-ekran.png || true

          cek() {   # cek <dosya-adı> <bekleme> [ek bayraklar...]
            AD=$1; BEKLE=$2; shift 2
            xcrun simctl terminate "$UDID" com.medowl.app >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.medowl.app "$@" >/dev/null 2>&1 || true
            sleep "$BEKLE"
            xcrun simctl io "$UDID" screenshot "gorseller/$AD.png" || true
          }

          cek 00-karsilama 8 -ekran karsilama
          cek 01-bos-bugun 6 -ekran bugun
          for E in bugun ilaclar ekle rapor; do cek "ornek-$E" 8 -ornek -ekran "$E"; done
          # Faz 2: tarayıcı (simülatörde kamera yok → elle giriş ekranı) ve okunmuş kutuyla dolan form.
          cek ornek-karekod-tarayici 8 -ornek -ekran karekod
          cek ornek-karekod-ekle 10 -ornek -ekran ekle -karekod "(01)08699546130238(21)ORNEKKUTU42(17)281130(10)P2401"

          xcrun simctl terminate "$UDID" com.medowl.app >/dev/null 2>&1 || true
          xcrun simctl spawn "$UDID" log show --last 10m \
            --predicate 'process == "Medowl"' --style compact 2>/dev/null \
            | grep -iE "fatal|crash|error|exception|Medowl:" | tail -80 \
            > gorseller/simulator-gunlugu.txt || true
          ls -la gorseller/ || true

      - name: Ekran görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: gorseller/
          retention-days: 7
          if-no-files-found: ignore

      - name: .ipa dosyasına paketle
        run: |
          mkdir -p Payload
          cp -R yapi/Build/Products/Release-iphoneos/Medowl.app Payload/
          zip -qry Medowl.ipa Payload
          ls -lh Medowl.ipa

      - name: İndirilebilir hale getir
        uses: actions/upload-artifact@v4
        with:
          name: medowl-ipa
          path: Medowl.ipa
          retention-days: 30
