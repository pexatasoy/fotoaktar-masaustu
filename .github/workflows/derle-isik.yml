name: Işık oyununu derle

on:
  workflow_dispatch:          # elle çalıştırılıyor

jobs:
  derle:
    # GitHub'ın macOS 26 sunucusu — Xcode 26 kurulu geliyor.
    # Kullanıcının kendi Mac'i (macOS 14.4, Xcode 16.2) iOS 26 telefona uygulama
    # atamıyor ve yükseltmeye diskte yer yok; o yüzden derleme burada.
    runs-on: macos-26

    steps:
      # Kaynak depodan DEĞİL sunucudan geliyor: her değişiklikte GitHub'a dosya
      # yüklemek gerekmesin. Depoda sadece bu iş akışı dosyası duruyor.
      - name: Kaynağı çek
        run: |
          # Tek denemeye bırakmıyoruz: anlık bir kopma bütün derlemeyi çöpe atıyor.
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -H "Cache-Control: no-cache" -o ios-kaynak.zip https://chainmedia.co/fotoyol/isik/isik-kaynak.zip \
            || { echo "Kaynak indirilemedi — sunucu geçici olarak erişilemiyor olabilir."; exit 1; }
          unzip -oq ios-kaynak.zip
          echo "--- bu derlemedeki kaynak ---"
          cat DAMGA.txt
          ls -R Kaynaklar project.yml

      - name: Ortamı göster
        run: |
          sw_vers
          xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: Derle (imzasız — imzalamayı Sideloadly yapacak)
        run: |
          set -o pipefail
          # xcodebuild binlerce satır basıyor; hata mesajı içinde kayboluyor.
          # Günlüğü dosyaya alıp başarısızlıkta SADECE hata satırlarını
          # yazdırıyoruz — böylece tek bakışta ne olduğu görülüyor.
          if ! xcodebuild \
            -project isik.xcodeproj \
            -scheme isik \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath yapi \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build > derleme.log 2>&1; then
              echo ""
              echo "================== DERLEME HATALARI =================="
              grep -E "error:" derleme.log | sed "s|$PWD/||" | sort -u | head -60
              echo "====================================================="
              echo ""
              echo "(tam günlük 'derleme-gunlugu' eseri olarak yüklendi)"
              exit 1
          fi
          echo "✅ derleme başarılı"

      - name: Tam günlüğü sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-gunlugu
          path: derleme.log
          retention-days: 7
          if-no-files-found: ignore

      # 🚨 BU ADIM PROJENİN EN BÜYÜK KÖR NOKTASINI KAPATIYOR.
      # SwiftUI Linux'ta derlenmiyor, dolayısıyla arayüz HİÇ GÖRÜLMÜYORDU;
      # görsel bozukluklar ancak kullanıcı telefonda oynayınca çıkıyordu.
      # Dükkânı altı kategoride birden kıran `w * 034` yazım hatası tam
      # olarak böyle kaçtı: derleyici için geçerli bir sayı, ekranda felaket.
      #
      # ⚠️ AYRI BİR SİMÜLATÖR DERLEMESİ ŞART: yukarıdaki derleme `iphoneos`
      # yani gerçek cihaz içindir, simülatörde çalışmaz (mimari farklı).
      # ⚠️ Bütün adım `continue-on-error`: ekran görüntüsü alınamazsa
      # .ipa üretimi düşmemeli, o asıl iş.
      - name: Simülatör derlemesi ve ekran görüntüsü
        continue-on-error: true
        run: |
          set -x
          xcodebuild \
            -project isik.xcodeproj -scheme isik \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath sim \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -quiet build || exit 0

          UYG=$(find sim/Build/Products -name "isik.app" -maxdepth 3 | head -1)
          echo "uygulama: $UYG"
          [ -z "$UYG" ] && exit 0
          mkdir -p gorseller

          # ⚠️ CİHAZ ADLARI KOŞUCUYLA DEĞİŞİYOR. İlk denemede "iPhone 16
          # Pro Max" arandı, makinede 17 serisi vardı ve iPhone görüntüsü
          # hiç alınmadı. Ad tam eşleşmezse adım sessizce geçiyor, o yüzden
          # önce listeyi basıyoruz.
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

          cek () {   # cek <cihaz adı> <dil> <perde> <dosya adı>
            UDID=$(xcrun simctl list devices available \
                   | grep -m1 "$1 (" | grep -oE "[0-9A-F-]{36}") || true
            if [ -z "$UDID" ]; then echo "cihaz bulunamadı: $1"; return 0; fi
            xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
            xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$UYG" || return 0
            # ⚠️ Dil simülatörün kendi ayarından değil, uygulamanın
            # `-AppleLanguages` bayrağından geliyor: mağaza görselleri
            # hem Türkçe hem İngilizce lazım.
            # ⚠️ 3. parametre TAM BAYRAK: "-perde dukkan" ya da
            # "-sahne bolum:33". Eskiden yalnız perde adıydı ve önüne
            # "-perde" ekleniyordu; oyun ekranları eklenince yetmedi.
            EK="$3"
            xcrun simctl launch "$UDID" com.littlelightgame.app \
              -AppleLanguages "($2)" -AppleLocale "$2" $EK || true
            # ⚠️ Bekleme ŞART: açılışta 150 bölüm ve varlıklar yükleniyor;
            # hemen çekilen resim boş çıkıyor.
            sleep 28
            xcrun simctl io "$UDID" screenshot "gorseller/$4.png" || true
            xcrun simctl terminate "$UDID" com.littlelightgame.app || true
          }

          TEL="iPhone 17 Pro Max"
          TAB="iPad Pro 13-inch (M5)"

          # ⚠️ İki ayrı bayrak var: `-perde` menü perdelerini (Menu.swift),
          # `-sahne` kök ekranları (IsikApp.swift) açıyor. Vitrinin en
          # önemli görseli tahtanın kendisi, o yüzden farklı dünyalardan
          # bölümler çekiliyor — her dünyanın kendi odası ve paleti var.
          cek "$TEL" tr ""              tel_menu_tr
          cek "$TEL" en ""              tel_menu_en
          cek "$TEL" tr "-sahne bolum:2"    tel_bolum_d1
          cek "$TEL" tr "-sahne bolum:33"   tel_bolum_d3
          cek "$TEL" tr "-sahne bolum:63"   tel_bolum_d5
          cek "$TEL" tr "-sahne bolum:93"   tel_bolum_d7
          cek "$TEL" tr "-sahne bolum:123"  tel_bolum_d9
          cek "$TEL" tr "-sahne liste"      tel_liste
          cek "$TEL" tr "-sahne gunluk"     tel_gunluk
          cek "$TEL" tr "-sahne kilit"      tel_kilit
          cek "$TEL" tr "-perde dukkan"     tel_dukkan_tr
          cek "$TEL" en "-perde dukkan"     tel_dukkan_en
          cek "$TEL" tr "-perde ayarlar"    tel_ayarlar_tr
          cek "$TEL" tr "-perde profil"     tel_profil_tr
          cek "$TEL" tr "-perde modlar"     tel_modlar_tr
          # Mektup sahneleri — dokuz dünyanın ışığı, ışığın en güçlü anında
          # dondurulmuş. ⚠️ `-mektupAn` olmadan hepsi sönmüş hâlde çıkıyor:
          # sahne 5 saniyede akıp geçiyor, görüntü 28. saniyede alınıyor.
          # Bakılacak şey: ışık sahnedeki GERÇEK kaynaktan mı çıkıyor
          # (pencere, fener odası, kuyu ağzı) ve kenarları düz mü.
          for D in 1 2 3 4 5 6 7 8 9; do
            cek "$TEL" tr "-sahne mektup:$D -mektupAn 2.0" tel_mektup_d$D
          done
          # Mektup kâğıdı sahnenin üstünde okunuyor mu (ışık çekilmiş hâli)
          cek "$TEL" tr "-sahne mektup:1 -mektupAn 6.0" tel_mektup_d1_yazi
          cek "$TEL" tr "-sahne mektup:8 -mektupAn 6.0" tel_mektup_d8_yazi
          # 🚨 GÖREMEDİĞİM EKRAN = DOĞRULANMAMIŞ EKRAN. Aşağıdaki dördü
          # hiç görüntülenmiyordu, dolayısıyla yerleşimleri kör yazılmıştı.
          # Vitrin kareleri için eksik ekranlar.
          # ⚠️ 2. DÜNYA: CI 1,3,5,7,9'u çekiyordu; 2. dünya hiç yoktu ve
          # vitrinin ilk karesi oradan olacak (1. dünya da tavan arası
          # olduğu için oda içinde oda çıkıyor).
          cek "$TEL" tr "-sahne bolum:17"   tel_bolum_d2
          cek "$TEL" tr "-perde muze"       tel_muze
          cek "$TEL" tr "-sahne sonsuz"     tel_sonsuz
          # 🚨 VİTRİNDE KULLANILAN HER EKRANIN İNGİLİZCESİ DE ŞART.
          # İngilizce mağaza sayfasında Türkçe arayüz ("Bölüm 4", "hamle 0")
          # görünmesi, indiren kişiye yanlış söz vermek olur.
          cek "$TEL" en "-sahne bolum:17"   tel_bolum_d2_en
          cek "$TEL" en "-sahne bolum:33"   tel_bolum_d3_en
          cek "$TEL" en "-perde muze"       tel_muze_en
          cek "$TEL" en "-sahne sonsuz"     tel_sonsuz_en
          cek "$TEL" en "-sahne gunluk"     tel_gunluk_en
          cek "$TEL" en "-sahne mektup:1 -mektupAn 6.0" tel_mektup_d1_yazi_en
          # 🚨 VİTRİNİN MENÜ KARESİ İÇİN GECE MANZARASI. Vitrinin zemini
          # tavan arası; menünün varsayılan manzarası da tavan arası, yani
          # "odanın içinde oda" çıkıyor ve pencere iki ayrı ölçekte iki kez
          # görünüyor. Gece manzarası hem ayrışıyor hem dükkândaki bir
          # kozmetiği gösteriyor.
          # ⚠️ Sonrasında batıma geri alınıyor: manzara kaydı kalıcı.
          # ⚠️ ÖNCE GELİŞTİRİCİ MODUNU KAPAT: yukarıdaki "sonsuz" ve
          # "kilitsiz" bayrakları onu açıyor ve simülatörde kalıcı;
          # vitrinin menü karesinde cüzdan 999.999 çıkıyordu.
          cek "$TEL" tr "-sahne kilitli"       tel_kilitli
          cek "$TEL" tr "-sahne manzara:sis"   tel_menu_sis
          cek "$TEL" tr "-sahne manzara:gece"  tel_menu_gece
          cek "$TEL" en "-sahne manzara:gece"  tel_menu_gece_en
          cek "$TEL" tr "-sahne manzara:batim" tel_menu_batim
          cek "$TEL" tr "-perde kunye"      tel_kunye_tr
          cek "$TEL" en "-perde kunye"      tel_kunye_en
          # Öğretici kartı — dokunuş işareti EN BELİRGİN anında dondurulmuş.
          # ⚠️ `-dersAn` olmadan işaret 1,7 sn'lik turun 0,8 sn'sinde
          # görünüyor, çekimde yakalanması kuraya kalıyordu.
          cek "$TEL" tr "-sahne ders:2 -dersAn 1.0"  tel_ders
          # Menü kilitler AÇIKKEN: "sonsuz" ve "vitrin" düğmeleri temiz
          # kurulumda kapalı, yerleşimleri hiçbir karede görünmüyordu.
          # ⚠️ EN SONA: bu iki kare geliştirici modunu AÇIYOR ve kayıt
          # simülatörde kalıcı. Daha önce alınırsa sonraki karelerde
          # cüzdan 999.999 çıkıyor ve kilitli düğmeler açık görünüyor —
          # vitrinin menü karesine tam olarak böyle sızmıştı.
          cek "$TEL" tr "-sahne kilitsiz"   tel_menu_acik
          cek "$TEL" tr "-sahne kilitsiz -perde modlar" tel_modlar_acik
          cek "$TAB" tr ""                  tab_menu_tr
          cek "$TAB" tr "-sahne kilitsiz"   tab_menu_acik
          cek "$TAB" tr "-sahne bolum:33"   tab_bolum_d3

          ls -la gorseller/ || true

      - name: Ekran görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: gorseller/
          retention-days: 7
          if-no-files-found: ignore

      - name: .ipa dosyasına paketle
        run: |
          mkdir -p Payload
          cp -R yapi/Build/Products/Release-iphoneos/isik.app Payload/
          zip -qry isik.ipa Payload
          ls -lh isik.ipa

      - name: İndirilebilir hale getir
        uses: actions/upload-artifact@v4
        with:
          name: isik-ipa
          path: isik.ipa
          retention-days: 30

  # 🚨 AYRI İŞ: iPad çökme testi.
  # Apple derleme 2'yi 2.1(a)'dan reddetti ("crashed on launch",
  # iPad Air 11-inch M3, iPadOS 26.6.1). Oyun iPhone-only ama iPhone
  # uygulamaları iPad'e kurulabiliyor ve Apple orada da açıyor.
  # ⚠️ NEDEN AYRI İŞ: `derle` işinin ekran görüntüsü adımı 30+ dakika
  # sürüyor ve GitHub iş bitmeden adım günlüğünü vermiyor. Bu iş tek
  # başına birkaç dakikada bitip günlüğünü teslim ediyor.
  # ⚠️ İKİ DİL BİRDEN: iPad kareleri bugüne kadar YALNIZ Türkçe
  # çekiliyordu, İngilizce yalnız telefonda. iPad+İngilizce hiç
  # denenmemişti — çökmenin saklandığı boşluk tam orasıydı.
  ipad-cokme:
    runs-on: macos-26
    steps:
      - name: Kaynağı çek
        run: |
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -H "Cache-Control: no-cache" -o ios-kaynak.zip https://chainmedia.co/fotoyol/isik/isik-kaynak.zip
          unzip -oq ios-kaynak.zip
          cat DAMGA.txt
      - name: XcodeGen kur
        run: brew install xcodegen
      - name: Xcode projesini üret
        run: xcodegen generate
      - name: Simülatör derlemesi
        run: |
          xcodebuild -project isik.xcodeproj -scheme isik \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath sim \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet build
      - name: iPad'de aç ve çökmeyi yakala
        run: |
          UYG=$(find sim/Build/Products -name "isik.app" -maxdepth 3 | head -1)
          echo "uygulama: $UYG"
          mkdir -p tani

          dene () {   # dene <cihaz adı> <dil>
            echo "════════ $1 · $2 ════════"
            UDID=$(xcrun simctl list devices available | grep -m1 "$1 (" | grep -oE "[0-9A-F-]{36}")
            if [ -z "$UDID" ]; then echo "cihaz yok: $1"; return 0; fi
            ETIKET=$(echo "$1$2" | tr -cd '[:alnum:]')
            xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
            xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$UYG"
            rm -rf ~/Library/Logs/DiagnosticReports/* || true

            xcrun simctl launch --console-pty "$UDID" com.littlelightgame.app \
              -AppleLanguages "($2)" -AppleLocale "$2" > tani/konsol_$ETIKET.txt 2>&1 &
            KPID=$!
            sleep 35

            # 🚨 SIRA ÖNEMLİ: önce bak, SONRA öldür. İlk denemede ekran
            # görüntüsü kill'den SONRA alınıyordu ve ana ekran çıkıyordu —
            # çökmeyi ben yaratmış olabilirdim, ölçüm işe yaramazdı.
            echo "----- surec ayakta mi -----"
            if xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q littlelightgame; then
              echo "AYAKTA"
            else
              echo "🚨 SUREC YOK"
            fi
            xcrun simctl io "$UDID" screenshot "tani/$ETIKET.png" >/dev/null 2>&1 || true

            kill $KPID 2>/dev/null || true
            echo "----- konsol -----"
            cat tani/konsol_$ETIKET.txt || true
            echo "----- cokme raporlari -----"
            BULDU=0
            for f in $(find ~/Library/Logs/DiagnosticReports -type f 2>/dev/null); do
              case "$f" in *isik*|*Little*) ;; *) continue;; esac
              BULDU=1; echo "### $f"; head -70 "$f"; cp "$f" tani/ 2>/dev/null || true
            done
            # ⚠️ Simülatör raporu cihazın kendi klasörüne de düşebiliyor.
            # ⚠️ Bu klasörde DİZİN de var (CrashReporter/Assistant) — `head`
            # dizinde hata verip bütün adımı düşürdü. Yalnız düz dosya.
            for f in $(find ~/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/CrashReporter -type f 2>/dev/null); do
              BULDU=1; echo "### $f"; head -70 "$f"; cp "$f" tani/ 2>/dev/null || true
            done
            [ "$BULDU" = 0 ] && echo "(cokme raporu yok)"
            xcrun simctl terminate "$UDID" com.littlelightgame.app 2>/dev/null || true
          }

          # Apple'ın kullandığı cihaz Air 11", bizim çalışan karemiz Pro 13".
          dene "iPad Air 11-inch" en
          dene "iPad Air 11-inch" tr
          dene "iPad Pro 13-inch" en

      - name: Tanıyı sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-tani
          path: tani/
