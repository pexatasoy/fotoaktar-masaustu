name: Little Light

# ⚠️ İKİ AYRI İŞ, BİLEREK. Eskiden tek iş vardı ve her denemede .ipa
# paketleyip yüklüyordu; sadece "derleniyor mu" sorusunu sormak için
# 10 dakika bekleniyordu. Artık hızlı denetim önce koşuyor ve derleme
# hatasını 3-4 dakikada söylüyor; paketleme yalnız o geçerse çalışıyor.
on:
  push:
  workflow_dispatch:
    inputs:
      paket:
        description: ".ipa da üretilsin mi? (denetim her hâlükârda koşar)"
        type: boolean
        default: true

jobs:
  # ---------------------------------------------------------------- denetim
  denetim:
    name: Derleniyor mu?
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Ortam
        run: xcodebuild -version

      # ⚠️ brew her koşuda ~1 dakika yiyordu. XcodeGen'in hazır ikilisi
      # indirilirse aynı iş birkaç saniye sürüyor.
      - name: XcodeGen
        run: brew install xcodegen

      - name: Xcode projesi
        run: xcodegen generate

      # ⚠️ `build` zaten TAM tip denetimi yapıyor — ayrı bir "typecheck"
      # adımına gerek yok. Kazanç paketlemeyi ATLAMAKTAN geliyor.
      # ⚠️ `-quiet` + `pipefail`: gürültü kesiliyor ama hata satırı kaçmıyor.
      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild \
            -project isik.xcodeproj \
            -scheme isik \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath yapi \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet build

      # 🚨 BU ADIM PROJENİN EN BÜYÜK KÖR NOKTASINI KAPATIYOR.
      # SwiftUI Linux'ta derlenmiyor, dolayısıyla arayüzü hiç GÖREMİYORDUM;
      # görsel bozukluklar ancak kullanıcı telefonda oynayınca çıkıyordu.
      # Dükkânı altı kategoride birden kıran `w * 034` yazım hatası tam
      # olarak böyle kaçtı: derleyici için geçerli bir sayı, ekranda felaket.
      # Simülatör CI makinesinde zaten var, `.app` de derlenmiş durumda —
      # tek eksik onu açıp resmini çekmekti.
      #
      # ⚠️ Ekran görüntüleri artefakt olarak yükleniyor; sunucudan indirip
      # bakılıyor. Mağaza için gereken görseller de buradan çıkacak.
      - name: Simülatörde ekran görüntüsü
        continue-on-error: true          # görüntü alınamazsa derleme düşmesin
        run: |
          set -x
          UYG=$(find yapi/Build/Products -name "isik.app" -maxdepth 3 | head -1)
          echo "uygulama: $UYG"
          mkdir -p gorseller

          cek () {   # cek <cihaz adı> <dosya öneki>
            UDID=$(xcrun simctl list devices available                    | grep -m1 "$1 (" | grep -oE "[0-9A-F-]{36}")
            if [ -z "$UDID" ]; then echo "cihaz yok: $1"; return 0; fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl install "$UDID" "$UYG"
            xcrun simctl launch "$UDID" com.littlelightgame.app || true
            # ⚠️ Bekleme ŞART: oyun açılışta 150 bölümü ve varlıkları
            # yüklüyor, hemen çekilen resim boş çıkıyor.
            sleep 25
            xcrun simctl io "$UDID" screenshot "gorseller/$2.png" || true
            xcrun simctl shutdown "$UDID" || true
          }

          xcrun simctl list devices available | head -40
          cek "iPhone 16 Pro Max" iphone
          cek "iPad Pro"          ipad
          ls -la gorseller/

      - name: Ekran görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: gorseller/
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------- paket
  paket:
    name: .ipa üret
    needs: denetim
    if: github.event_name != 'workflow_dispatch' || inputs.paket
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Release derlemesi (imzasız — imzayı Sideloadly atacak)
        run: |
          set -o pipefail
          xcodebuild \
            -project isik.xcodeproj \
            -scheme isik \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath yapi \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Paketle
        run: |
          mkdir -p Payload
          cp -R yapi/Build/Products/Release-iphoneos/isik.app Payload/
          zip -qry LittleLight.ipa Payload
          ls -lh LittleLight.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LittleLight-ipa
          path: LittleLight.ipa
          retention-days: 30
