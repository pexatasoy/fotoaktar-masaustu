name: Seyir - personal native build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Compile and inspect native app
        run: python3 .seyir-personal/ci/check_native.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seyir-personal-evidence
          path: |
            evidence/*.log
            evidence/*.png
          retention-days: 7
      - name: Save unsigned device build for later signing
        uses: actions/upload-artifact@v4
        with:
          name: seyir-personal-unsigned-device
          path: evidence/appletvos/Build/Products/Release-appletvos/
          retention-days: 7
