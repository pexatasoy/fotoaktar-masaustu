name: Işık tanıtım videosu

# Elle çalıştırılıyor. Oyunu `-sahne demo:<sıra>` kipinde açıp çözücüye
# kendi kendine oynatıyor ve simülatör ekranını kaydediyor. Kurgu (kesme,
# birleştirme, müzik) sunucuda ffmpeg ile yapılıyor.
on:
  workflow_dispatch:

jobs:
  kaydet:
    runs-on: macos-26
    # ⚠️ `simctl` asılı kalabiliyor (2026-09-11'de iPad işi 26 dk tek adımda
    # bekledi) — hem iş hem her komut süreli.
    timeout-minutes: 35
    steps:
      - name: Kaynağı çek
        run: |
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -H "Cache-Control: no-cache" -o ios-kaynak.zip https://chainmedia.co/fotoyol/isik/isik-kaynak.zip
          unzip -oq ios-kaynak.zip
          cat DAMGA.txt
      - name: XcodeGen kur
        run: brew install xcodegen
      - name: Xcode projesini üret
        run: xcodegen generate
      # ⚠️ DEBUG ŞART: demo kipi `#if DEBUG` içinde, Release'e girmiyor.
      # 🚨 AMA OPTİMİZASYON AÇIK (-O): optimizasyonsuz derlemede çözücü
      # 40. bölümde hamle başına 3,2 sn sürdü ve Canvas animasyonları da
      # gerçek oyundan ağır akıyor — video oyunu olduğundan kötü gösterirdi.
      # DEBUG koşul bayrağı `SWIFT_ACTIVE_COMPILATION_CONDITIONS`ten geliyor,
      # optimizasyon seviyesinden bağımsız.
      - name: Simülatör derlemesi (Debug)
        run: |
          xcodebuild -project isik.xcodeproj -scheme isik \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath sim \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Kaydet
        run: |
          sinirli () { S=$1; shift; perl -e 'alarm shift; exec @ARGV' "$S" "$@"; }
          UYG=$(find sim/Build/Products -name "isik.app" -maxdepth 3 | head -1)
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 17 Pro Max (" | grep -oE "[0-9A-F-]{36}")
          echo "cihaz: $UDID"
          # Temiz cihaz: geliştirici modu ve eski kayıt sızmasın (vitrinde
          # cüzdan 999.999 göründüğü olmuştu).
          sinirli 60 xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
          sinirli 90 xcrun simctl erase "$UDID" || true
          sinirli 90 xcrun simctl boot "$UDID" || true
          sinirli 180 xcrun simctl bootstatus "$UDID" -b || true
          sleep 12
          # Durum çubuğu vitrin temizliğinde: 9.41, tam pil, tam çekim.
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100 || true
          sinirli 120 xcrun simctl install "$UDID" "$UYG"
          mkdir -p klipler

          kaydet () {   # kaydet <sıra> <dil> <saniye>
            ETIKET="bolum$1_$2"
            echo "════ $ETIKET ════"
            sinirli 20 xcrun simctl terminate "$UDID" com.littlelightgame.app 2>/dev/null || true
            sleep 3
            # ⚠️ Kayıt ÖNCE başlıyor, uygulama sonra açılıyor: baştaki
            # fazlalık sunucuda kurguda kesiliyor. Tersi sırada ilk
            # hamleler kaydedici ısınırken kaçıyordu.
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "klipler/$ETIKET.mp4" &
            KP=$!
            sleep 2
            # --stdout: uygulamanın "DEMO:" satırları. --console-pty
            # kullanılmıyor, onu öldürmek uygulamayı da kapatabiliyor.
            sinirli 60 xcrun simctl launch --stdout="$PWD/klipler/$ETIKET.log" \
              --stderr="$PWD/klipler/$ETIKET.log" "$UDID" com.littlelightgame.app \
              -sahne "demo:$1" -AppleLanguages "($2)" -AppleLocale "$2" || echo "⚠️ baslatilamadi"
            sleep "$3"
            # ⚠️ SIGINT ŞART: öldürülen kayıt dosyayı kapatmıyor.
            # ⚠️ `wait` kabuk komutu — perl üzerinden (sinirli) ÇALIŞMIYOR;
            # ilk sürümde bu yüzden bir sonraki klibe dosya yazılmadan
            # geçildi. Süre sınırı ayrı bir bekçiyle.
            kill -INT $KP 2>/dev/null || true
            ( sleep 40; kill -9 $KP 2>/dev/null ) & BK=$!
            wait $KP 2>/dev/null || true
            kill $BK 2>/dev/null || true
            ls -la "klipler/$ETIKET.mp4" || echo "⚠️ klip yok"
            echo "--- uygulama gunlugu ---"; cat "klipler/$ETIKET.log" 2>/dev/null || true
          }

          # Pencere geniş: açılış + hesaplama + 8 hamle×0,95 + kutlama.
          kaydet 40 tr 24
          kaydet 24 tr 22
          kaydet 8  tr 21
          kaydet 40 en 24
          kaydet 24 en 22
          kaydet 8  en 21
      - name: Klipleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanitim-klipleri
          path: klipler/
          retention-days: 30
